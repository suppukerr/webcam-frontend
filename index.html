<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Xbox Camera Interface</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        body{
            margin:0;
            height:100vh;
            display:grid;
            place-items:center;
            background:#000;
            overflow:hidden;
        }

        /* Контейнер устройства */
        .app{
            position:relative;
            width:min(420px, 92vw);
            aspect-ratio: 3 / 4.25;
        }

        /* PNG-слои */
        .layer{
            position:absolute;
            inset:0;
            background-repeat:no-repeat;
            background-position:center;
            background-size:contain;
            pointer-events:none;
        }
        .bg{  z-index: 0; color: #333; }
        .body{ z-index: 2; background-image:url("maket/body.png"); }

        /* ЭКРАН: абсолютная позиция + круглая маска */
        .screen{
            z-index: 1;
            position:absolute;
            left:50%;
            top:10%;
            width:74%;
            aspect-ratio:1/1;
            transform:translateX(-50%);

            border-radius:50%;
            overflow:hidden;          /* маска круга */
            pointer-events:none;      /* экран не должен перехватывать клики по кнопкам */
        }

        .screen img,
        .screen video{
            position:absolute;
            inset:0;
            width:100%;
            height:100%;
            object-fit:cover;
        }

        /* видео скрыто по умолчанию */
        .screen video{
            display:none;
            transform:scaleX(-1);
        }

        /* лёгкий блик/эффект, если нужно */
        .screenFx{
            position:absolute;
            inset:0;
            background:linear-gradient(135deg, rgba(255,255,255,.18), transparent 45%);
            mix-blend-mode:screen;
            opacity:.35;
            pointer-events:none;
            
        }
        .btn.active{ filter: brightness(1.08); }

        /* КНОПКИ: кликабельные PNG */
        .btn{
            z-index: 3;
            position:absolute;
            border:none;
            background:transparent;
            cursor:pointer;
            padding:0;
        }

        /* большая кнопка */
        .big{
            width:32%;
            aspect-ratio:1/1;
            left:50%;
            bottom:11.5%;
            transform:translateX(-50%);
            background:url("maket/big_button.png") no-repeat center/contain;
        }

        /* малые */
        .small{
            width:15%;
            aspect-ratio:1/1;
            background-repeat:no-repeat;
            background-position:center;
            background-size:contain;
        }

        /* позиции подгонишь */
        .s1{ left:21%;  bottom:25%; background-image:url("maket/small_1.png"); }
        .s2{ right:21%; bottom:25%; background-image:url("maket/small_2.png"); }
        .s3{ left:21%;  bottom:10%; background-image:url("maket/small_3.png"); }
        .s4{ right: 21%; bottom:10%; background-image:url("maket/small_4.png"); }
    </style>
</head>
<body>
    <canvas id="canvas" style="display:none;"></canvas>

    <!-- <div id="memory-overlay">
        <h2 style="color: var(--xbox-green)">MEMORY SLOT 01</h2>
        <img id="memory-image" src="" alt="Capture">
        <div style="display: flex; gap: 10px;">
            <button class="close-btn" id="download-btn">DOWNLOAD</button>
            <button class="close-btn" onclick="closeMemory()" style="background:#333; color:white;">CLOSE</button>
        </div>
    </div> -->

    <div class="app">
        <div class="layer bg"></div>

        <div class="screen" id="screen">
            <img id="fallback" src="maket/screen.png" alt="" />
            <video id="video" autoplay playsinline muted></video>

    <!-- сюда рисуем fisheye -->
            <canvas id="fx" width="720" height="720"></canvas>

            <div class="screenFx"></div>
        </div>

        <div class="layer body"></div>

        <button class="btn big" id="start-btn"></button>
        <button class="btn small s1" id="memory-btn"></button>
        <button class="btn small s2" id="share-btn"></button>
        <button class="btn small s3" data-action="back"></button>
        <button class="btn small s4" data-action="ok"></button>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const fallback = document.getElementById('fallback');
        const startBtn = document.getElementById('start-btn');
        const shareBtn = document.getElementById('share-btn');
        const memoryBtn = document.getElementById('memory-btn');
        const downloadBtn = document.getElementById('download-btn');
        const logo = document.getElementById('xbox-logo');
        const tg = window.Telegram.WebApp;

        let lastPhoto = null;

        tg.expand();

        startBtn.onclick = async () => {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "user" },
            audio: false
            });

            video.srcObject = stream;
            await video.play();

            // ВОТ ЭТОГО СЕЙЧАС НЕ ХВАТАЕТ:
            fallback.style.display = 'none';
            video.style.display = 'block';

            startBtn.classList.add('active');
            shareBtn.style.display = 'block';
        } catch (err) {
            // камера не доступна — оставляем fallback
            video.style.display = 'none';
            fallback.style.display = 'block';

            (tg?.showAlert ? tg.showAlert : alert)("Камера недоступна: " + err.message);
        }
        };

        function capture() {
            const ctx = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.translate(canvas.width, 0);
            ctx.scale(-1, 1);
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            return canvas.toDataURL('image/png');
        }

        shareBtn.onclick = () => {
            lastPhoto = capture();
            if (tg.shareToStory) {
                tg.shareToStory(lastPhoto, { text: "Xbox Vision System Activated 🟢" });
            } else {
                tg.showAlert("Обновите Telegram для Stories");
            }
        };

        memoryBtn.onclick = () => {
            if (!lastPhoto) {
                tg.showAlert("Сначала сделайте снимок (Share Story)");
                return;
            }
            document.getElementById('memory-image').src = lastPhoto;
            document.getElementById('memory-overlay').style.display = 'flex';
        };

        downloadBtn.onclick = () => {
            const link = document.createElement('a');
            link.href = lastPhoto;
            link.download = `xbox_snap_${Date.now()}.png`;
            link.click();
        };

        function closeMemory() {
            document.getElementById('memory-overlay').style.display = 'none';
        }
    </script>
</body>
</html>
